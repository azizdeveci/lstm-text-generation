<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSTM Metin Üretici</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Genel ayarlar ve Animasyonlu Arka Plan */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Dinamik, hareket eden gradient */
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #00C9FF, #92FE9D);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #fff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Ana container */
        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            z-index: 1;
        }

        /* Başlık */
        h1 {
            font-weight: 600;
            margin-bottom: 25px;
            font-size: 2.2em;
            letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Form - Glassmorphism Efekti */
        form {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Label */
        label {
            margin-top: 15px;
            font-weight: 400;
            font-size: 0.9em;
            color: #e0e0e0;
            align-self: flex-start;
            margin-bottom: 5px;
        }

        /* Modern Input'lar */
        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 14px;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00C9FF;
            box-shadow: 0 0 10px rgba(0, 201, 255, 0.5);
        }
        
        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        /* Buton */
        button {
            margin-top: 25px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #00C9FF, #92FE9D);
            color: #111;
            font-weight: 600;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 201, 255, 0.4);
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 201, 255, 0.6);
        }

        /* Spinner (Yenilenmiş minimalist tasarım) */
        .spinner {
            margin-top: 20px;
            width: 35px;
            height: 35px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #00C9FF;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Sonuç kutusu - Glassmorphism */
        #result {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            font-size: 16px;
            color: #fff;
            min-height: 50px;
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.2);
            display: none; /* Sadece sonuç gelince göster */
            line-height: 1.6;
            text-align: left;
        }
        
        #result.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LSTM Metin Üretici</h1>
        <form id="generateForm">
            <label for="seed_text">Başlangıç Metni</label>
            <input type="text" id="seed_text" name="seed_text" placeholder="Bir şeyler yazın..." required>
            
            <label for="next_words">Kelime Sayısı</label>
            <input type="number" id="next_words" name="next_words" value="5" min="1">
            
            <button type="submit" id="generateBtn">Üret</button>
            <div id="spinner" class="spinner" style="display:none;"></div>
        </form>
        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById("generateForm");
        const btn = document.getElementById("generateBtn");
        const spinner = document.getElementById("spinner");
        const resultDiv = document.getElementById("result");

        form.addEventListener("submit", async function(e) {
            e.preventDefault();
            const seed_text = document.getElementById("seed_text").value;
            const next_words = parseInt(document.getElementById("next_words").value);

            // UI'ı bekleme moduna al
            btn.style.display = "none";
            spinner.style.display = "inline-block";
            resultDiv.classList.remove("show");
            resultDiv.innerText = "";

            try {
                const response = await fetch("/generate/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({seed_text, next_words})
                });
                
                const data = await response.json();
                resultDiv.innerText = data.output;
                resultDiv.classList.add("show");
            } catch (err) {
                resultDiv.innerText = "Bir hata oluştu: " + err;
                resultDiv.classList.add("show");
            } finally {
                // UI'ı eski haline döndür
                spinner.style.display = "none";
                btn.style.display = "block";
            }
        });
    </script>
</body>
</html>
